<!DOCTYPE html><html lang="th"><head><script src="theme.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>บัญชีผู้ใช้ — DummyJSON Store</title><link rel="stylesheet" href="style.css"><script src="auth.js" defer></script><script src="account.js" defer></script></head><body><nav class="site-nav" aria-label="เมนูหลัก"><a class="brand" href="/">DummyJSON Store</a><div><a href="/">สินค้า</a><a href="/history.html">ประวัติคำสั่งซื้อ</a><a href="/#cart-sidebar">ตะกร้า</a><a id="account-link" href="/account.html">เข้าสู่ระบบ / สมัครสมาชิก</a><button id="theme-toggle" class="theme-toggle" type="button" aria-label="เปลี่ยนเป็นโหมดมืด" aria-pressed="false">☾ Dark mode</button><button id="logout" type="button" hidden>ออกจากระบบ</button></div><span id="auth-nav-status" role="status"></span></nav><main class="container account-container"><header><span class="badge">บัญชีผู้ใช้</span><h1>ยินดีต้อนรับ</h1><p>เข้าสู่ระบบเพื่อสั่งซื้อและดูประวัติของคุณ</p></header><section id="signed-in" class="checkout" hidden><h2>บัญชีของคุณ</h2><p id="user-detail"></p><a href="/">เลือกซื้อสินค้า →</a><p><a href="/history.html">ดูคำสั่งซื้อของฉัน →</a></p></section><section id="auth-forms" class="checkout"><div class="auth-tabs"><button id="login-tab" type="button" aria-pressed="true">เข้าสู่ระบบ</button><button id="signup-tab" type="button" aria-pressed="false">สมัครสมาชิก</button></div><form id="auth-form"><div id="name-field" hidden><label for="name">ชื่อที่แสดง</label><input id="name" name="name" maxlength="100" autocomplete="name"></div><label for="email">อีเมล</label><input id="email" name="email" type="email" required maxlength="254" autocomplete="email"><label for="password">รหัสผ่าน (อย่างน้อย 8 ตัวอักษร)</label><input id="password" name="password" type="password" required minlength="8" maxlength="128" autocomplete="current-password"><button id="auth-submit" type="submit">เข้าสู่ระบบ</button></form></section><p id="auth-status" role="status" aria-live="polite"></p></main></body></html>
